<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Two-way sign language conversation, a full ASL course and a sign dictionary, running on your own computer.">
  <script>try{var q=JSON.parse(localStorage.getItem('sb.prefs'));if(q){document.documentElement.dataset.theme=q.theme||'dark';document.documentElement.dataset.motion=q.reduceMotion?'reduced':'full'}}catch(e){}</script>
  <link rel="stylesheet" href="/static/css/fonts.css">
  <link rel="icon" href="/favicon.svg">
  %sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
  <div style="display: contents">%sveltekit.body%</div>
</body>
</html>
