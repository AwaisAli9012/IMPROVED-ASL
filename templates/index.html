<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPROVED ASL - Sign Buffer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            padding: 30px;
        }
        .video-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .video-feed {
            width: 100%;
            border-radius: 10px;
            border: 3px solid #667eea;
            background: #000;
            max-height: 600px;
        }
        .control-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .group-selector {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .group-selector label {
            font-weight: bold;
            color: #333;
            font-size: 1.1em;
        }
        select {
            padding: 12px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
        }
        .word-bank {
            background: #f5f5f5;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 15px;
        }
        .word-bank h3 {
            color: #667eea;
            margin-bottom: 15px;
        }
        .signs-display {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 50px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .sign-tag {
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1em;
        }
        .empty-signs {
            color: #999;
            font-style: italic;
        }
        .button-group {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.3s;
        }
        .btn-backspace {
            background: #ff9800;
            color: white;
        }
        .btn-backspace:hover {
            background: #f57c00;
        }
        .btn-clear {
            background: #f44336;
            color: white;
        }
        .btn-clear:hover {
            background: #da190b;
        }
        .btn-generate {
            background: #4caf50;
            color: white;
            grid-column: 1 / -1;
            padding: 15px;
            font-size: 1.1em;
        }
        .btn-generate:hover {
            background: #45a049;
        }
        .status-box {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 15px;
            border-radius: 8px;
            color: #2e7d32;
        }
        .status-box h4 {
            margin-bottom: 8px;
        }
        .status-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
        }
        .sentence-output {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            border-radius: 8px;
            color: #1565c0;
            display: none;
            margin-top: 10px;
        }
        .sentence-output.show {
            display: block;
        }
        .sentence-output p {
            margin-top: 10px;
            font-size: 1.1em;
            line-height: 1.6;
        }
        .error {
            color: #d32f2f;
        }
        .success {
            color: #388e3c;
        }
        @media (max-width: 968px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 IMPROVED ASL - Sign Buffer + Sentence Generator</h1>
            <p>Detect signs → Build word bank → Generate sentences</p>
        </div>
        
        <div class="content">
            <div class="video-section">
                <img src="/video_feed" class="video-feed" alt="Live camera feed">
                <div class="status-box">
                    <h4>📊 System Status</h4>
                    <div class="status-info">
                        <span>Group: <strong id="current-group">SIGN1</strong></span>
                        <span>Hands: <strong id="hands-status">No</strong></span>
                    </div>
                </div>
            </div>
            
            <div class="control-section">
                <div class="group-selector">
                    <label for="group-select">Select Group:</label>
                    <select id="group-select">
                        <option value="">Loading...</option>
                    </select>
                </div>
                
                <div class="word-bank">
                    <h3>📝 Word Bank</h3>
                    <div class="signs-display" id="signs-container">
                        <span class="empty-signs">No signs detected yet...</span>
                    </div>
                </div>
                
                <div class="button-group">
                    <button class="btn-backspace" onclick="backspace()">⌫ Backspace</button>
                    <button class="btn-clear" onclick="clearBuffer()">🗑️ Clear</button>
                </div>
                
                <button class="btn-generate" onclick="generateSentence()">✨ Generate Sentence</button>
                
                <div class="sentence-output" id="sentence-output">
                    <h4>📄 Generated Sentence</h4>
                    <p id="sentence-text"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load groups on page load
        window.addEventListener('load', () => {
            loadGroups();
            updateBuffer();
            updateHealth(); // Initialize health updates
            setInterval(() => {
                updateBuffer();
                updateHealth(); // Poll health dynamically every second
            }, 1000);
        });
        
        // Load groups
        function loadGroups() {
            fetch('/api/groups')
                .then(r => r.json())
                .then(groups => {
                    const select = document.getElementById('group-select');
                    select.innerHTML = '';
                    Object.entries(groups).forEach(([id, info]) => {
                        const opt = document.createElement('option');
                        opt.value = id;
                        opt.textContent = `${id}: ${info.classes.join(', ')}`;
                        select.appendChild(opt);
                    });
                    
                    fetch('/api/group')
                        .then(r => r.json())
                        .then(data => {
                            select.value = data.current_group;
                            document.getElementById('current-group').textContent = data.current_group;
                        });
                });
        }
        
        // Group change
        document.getElementById('group-select').addEventListener('change', (e) => {
            if (e.target.value) {
                fetch('/api/group', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({group_id: e.target.value})
                })
                .then(r => r.json())
                .then(data => {
                    document.getElementById('current-group').textContent = data.group;
                });
            }
        });
        
        // Update buffer display
        function updateBuffer() {
            fetch('/api/buffer')
                .then(r => r.json())
                .then(data => {
                    const container = document.getElementById('signs-container');
                    
                    if (data.signs.length === 0) {
                        container.innerHTML = '<span class="empty-signs">No signs detected yet...</span>';
                    } else {
                        container.innerHTML = data.signs
                            .map(sign => `<span class="sign-tag">${sign}</span>`)
                            .join('');
                    }
                });
        }

        // Update system health and hand status display dynamically
        function updateHealth() {
            fetch('/api/health')
                .then(r => r.json())
                .then(data => {
                    const handsStatusEl = document.getElementById('hands-status');
                    if (data.hands_detected) {
                        handsStatusEl.textContent = data.active_prediction ? `Yes (${data.active_prediction})` : "Yes";
                        handsStatusEl.style.color = "#2e7d32";
                    } else {
                        handsStatusEl.textContent = "No";
                        handsStatusEl.style.color = "#d32f2f";
                    }
                    if (data.current_group) {
                        document.getElementById('current-group').textContent = data.current_group;
                    }
                })
                .catch(err => console.error("Health fetch error:", err));
        }
        
        // Backspace
        function backspace() {
            fetch('/api/buffer', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: 'backspace'})
            })
            .then(r => r.json())
            .then(() => updateBuffer());
        }
        
        // Clear buffer
        function clearBuffer() {
            if (confirm('Clear all signs?')) {
                fetch('/api/buffer', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action: 'clear'})
                })
                .then(r => r.json())
                .then(() => {
                    updateBuffer();
                    document.getElementById('sentence-output').classList.remove('show');
                });
            }
        }
        
        // Generate sentence
        function generateSentence() {
            fetch('/api/buffer')
                .then(r => r.json())
                .then(data => {
                    if (data.signs.length === 0) {
                        alert('No signs in buffer. Add some signs first!');
                        return;
                    }
                    
                    const output = document.getElementById('sentence-output');
                    const textEl = document.getElementById('sentence-text');
                    
                    textEl.innerHTML = '<span class="success">⏳ Generating...</span>';
                    output.classList.add('show');
                    
                    fetch('/api/generate', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({signs: data.signs})
                    })
                    .then(r => r.json())
                    .then(result => {
                        if (result.sentence) {
                            textEl.innerHTML = `<span class="success">✓ ${result.sentence}</span>`;
                        } else if (result.error) {
                            textEl.innerHTML = `<span class="error">❌ ${result.error}</span>`;
                        } else {
                            textEl.innerHTML = `<span class="error">❌ Unknown error</span>`;
                        }
                    })
                    .catch(err => {
                        textEl.innerHTML = `<span class="error">❌ ${err.message}</span>`;
                    });
                });
        }
    </script>
</body>
</html>
