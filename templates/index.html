<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPROVED ASL - Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 1000px;
            width: 100%;
            padding: 30px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        .video-section {
            display: flex;
            flex-direction: column;
        }
        .video-feed {
            width: 100%;
            border-radius: 10px;
            border: 3px solid #667eea;
            background: #000;
        }
        .control-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .group-selector {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .group-selector label {
            font-weight: bold;
            color: #333;
            font-size: 1.1em;
        }
        select {
            padding: 12px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            background: white;
        }
        select:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(118, 75, 162, 0.3);
        }
        .search-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .search-box label {
            font-weight: bold;
            color: #333;
            font-size: 1.1em;
        }
        .search-input {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 1em;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(118, 75, 162, 0.3);
        }
        .search-btn {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: background 0.3s;
        }
        .search-btn:hover {
            background: #764ba2;
        }
        .info-box {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .info-box h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .info-box p {
            color: #666;
            line-height: 1.6;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }
        .status.active {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 IMPROVED ASL Detection</h1>
        
        <div class="content">
            <div class="video-section">
                <img src="/video_feed" class="video-feed" alt="Live camera feed">
            </div>
            
            <div class="control-section">
                <div class="group-selector">
                    <label for="group-select">Select Group:</label>
                    <select id="group-select">
                        <option value="">Loading...</option>
                    </select>
                </div>
                
                <div class="search-box">
                    <label for="search-input">Search for Class:</label>
                    <div class="search-input">
                        <input type="text" id="search-input" placeholder="e.g., 'A', 'help'">
                        <button class="search-btn" onclick="searchClass()">Search</button>
                    </div>
                </div>
                
                <div class="info-box">
                    <h3>📋 How to Use:</h3>
                    <p>1. Position your hand in front of the camera<br>
                    2. Select a group to narrow predictions<br>
                    3. Or search for a specific class<br>
                    4. Watch real-time predictions below!</p>
                </div>
                
                <div class="status active">
                    ✓ System Ready - 39 Models Loaded
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load groups on page load
        window.addEventListener('load', () => {
            fetch('/api/groups')
                .then(r => r.json())
                .then(groups => {
                    const select = document.getElementById('group-select');
                    select.innerHTML = '';
                    Object.entries(groups).forEach(([id, info]) => {
                        const opt = document.createElement('option');
                        opt.value = id;
                        opt.textContent = `${id}: ${info.classes.join(', ')}`;
                        select.appendChild(opt);
                    });
                    
                    fetch('/api/group')
                        .then(r => r.json())
                        .then(data => select.value = data.current_group);
                });
        });
        
        // Group change
        document.getElementById('group-select').addEventListener('change', (e) => {
            if (e.target.value) {
                fetch('/api/group', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({group_id: e.target.value})
                });
            }
        });
        
        // Search
        function searchClass() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;
            
            fetch('/api/search', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({query})
            })
            .then(r => r.json())
            .then(data => {
                if (data.found) {
                    document.getElementById('group-select').value = data.group;
                    fetch('/api/group', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({group_id: data.group})
                    });
                    alert(`✓ Found! Switched to ${data.group} - ${data.class}`);
                } else {
                    alert(`❌ Class "${query}" not found`);
                }
            });
        }
    </script>
</body>
</html>
